name: Kingdom Hearts Final Mix (JP)
sha1: b62bf252fdaf0b1a726668e28c244e1d83bcb146
options:
  basename: SLPS_251.98
  target_path: SLPS_251.98.rom
  elf_path: build/SLPS_251.98.elf
  base_path: ..
  platform: ps2
  compiler: EEGCC

  gp_value: 0x00494050

  asm_path: asm
  src_path: src
  build_path: build

  ld_script_path: build/SLPS_251.98.ld
  ld_dependencies: True
  ld_wildcard_sections: True
  ld_bss_contains_common: True

  create_asm_dependencies: True
  find_file_boundaries: False
  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  named_regs_for_c_funcs: False
  mips_abi_gpr: numeric
  subalign: 8

  section_order: [.text, .data, .rodata, .bss]
  auto_link_sections: [.data, .rodata, .bss]

segments:
  - name: main
    type: code
    start: 0x000000
    vram: 0x00100000
    bss_size: 0x1E0F80
    subsegments:
      # Sony runtime startup
      - [0x000000, asm, sdk/crt0]
      # Game code: one block until file boundaries are recovered
      - [0x0001D8, asm, game/text]
      - [0x012270, c, game/area_name]
      - [0x012498, c, game/area]
      - [0x013A48, asm]
      - [0x024C68, c, game/player_input]
      - [0x027500, asm]
      - [0x03E1F8, c, game/player]
      - [0x03F2C0, asm]
      - [0x059F78, c, game/actor_ground]
      - [0x05A418, asm]
      # Linked libraries. Starts are certain where noted; other starts are the first function
      # with library-specific evidence (error strings, syscalls, VU0 code), so a few functions
      # of the previous library may still sit in the block before.
      - [0x14F2E0, asm, sdk/libc]       # __assert; libc/libm/libgcc helpers up to libkernl
      - [0x157D40, asm, sdk/libkernl]   # syscall stubs, after 0x30 bytes of padding (certain)
      - [0x165608, asm, sdk/libgraph]   # sceGsDefDispEnv
      - [0x166A10, asm, sdk/libdma]
      - [0x1672F8, asm, sdk/libvu0]     # first VU0 macro-mode function
      - [0x167FE0, asm, sdk/libdbc]     # libdbc, libpad2, libvib (link order from version strings)
      - [0x1695F8, asm, sdk/libcdvd]
      - [0x170B40, asm, sdk/libpc]      # performance counter (COP0)
      - [0x170B60, asm, sdk/libmc]      # libmc, then libipu
      # Data, rodata and small data of every object, not yet separated
      - [0x172C70, data, data]
  - [0x394050]
